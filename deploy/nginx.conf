# /etc/nginx/sites-available/zeetech  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# Replace example.com with the real domain. Certbot adds the HTTPS block:
#   certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    server_name example.com www.example.com;

    # client video feedback can be large (keep in step with FEEDBACK_MAX_VIDEO_MB)
    client_max_body_size 200m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # hashed build assets never change — cache for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /brand/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
